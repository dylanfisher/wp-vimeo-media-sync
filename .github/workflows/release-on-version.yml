name: Release on Version Change

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version header
        id: version
        run: |
          current=$(grep -m1 '^ \* Version:' vimeo-media-sync.php | awk -F': ' '{print $2}')
          current=$(echo "$current" | tr -d '\r' | xargs)
          current=${current#v}
          current=$(echo "$current" | tr -cd '0-9A-Za-z._-')
          if [ -z "$current" ]; then
            echo "No Version header found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version header: $current"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # The tag is the source of truth for what has shipped. Diffing against HEAD~1
      # missed bumps that were not in the final commit of a push.
      - name: Check if tag exists
        id: tag
        if: steps.version.outputs.found == 'true'
        run: |
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "v${{ steps.version.outputs.version }} is already released; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${{ steps.version.outputs.version }} has no tag; releasing."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.found == 'true' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
